<ion-app>
  <ion-menu side="start" menuId="main-menu" contentId="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/home" routerDirection="root">
            <ion-icon name="list-outline" slot="start"></ion-icon>
            <ion-label>Lista</ion-label>
          </ion-item>
          <ion-item routerLink="/account" routerDirection="forward">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <ion-label>Conta</ion-label>
          </ion-item>
          <ion-item routerLink="/settings" routerDirection="forward">
            <ion-icon name="settings-outline" slot="start"></ion-icon>
            <ion-label>Configuração</ion-label>
          </ion-item>
          <ion-item routerLink="/about" routerDirection="forward">
            <ion-icon name="information-circle-outline" slot="start"></ion-icon>
            <ion-label>Sobre</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
