<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-menu-button slot="start"></ion-menu-button>
    <ion-title>
      Market List AI
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="todo-header">
    <img src="assets/icon/market.png" alt="Supermercado" style="width: 56px; height: 56px; display: block; margin: 0 auto 12px auto;" />
    <ion-item lines="none" class="todo-input">
      <ion-input placeholder="Adicionar item..." [(ngModel)]="newTask" (keyup.enter)="addTask()"></ion-input>
      <ion-button fill="solid" color="primary" (click)="addTask()">
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </div>

  <!-- Acima da lista -->
  <div class="totalizador" style="margin: 16px 0 8px 0;">
    <ion-row>
      <ion-col size="auto">
        <ion-chip color="primary">
          <ion-label>Total: {{ totalTasks }}</ion-label>
        </ion-chip>
      </ion-col>
      <ion-col size="auto">
        <ion-chip color="warning">
          <ion-label>Comprar: {{ toBuyCount }}</ion-label>
        </ion-chip>
      </ion-col>
      <ion-col size="auto">
        <ion-chip color="success">
          <ion-label>Comprados: {{ boughtCount }}</ion-label>
        </ion-chip>
      </ion-col>
    </ion-row>
  </div>

  <ion-reorder-group (ionItemReorder)="reorderTasks($event)" disabled="false" class="todo-list">
    <ion-item *ngFor="let task of tasks; let i = index" [ngClass]="{'done': task.done}" (click)="onToggleTask(task, i)">
      <ion-checkbox slot="start" [(ngModel)]="task.done"></ion-checkbox>
      <ion-label>{{ task.title }}</ion-label>
      <ion-badge *ngIf="task.low_stock !== undefined && task.low_stock < 4" color="danger" slot="end" style="margin-right:8px;">
        <ion-icon name="alert-circle-outline" style="vertical-align:middle;"></ion-icon>
          {{ task.low_stock }} dia(s)
        </ion-badge>
      <ion-button fill="clear" color="danger" slot="end" (click)="removeTask(i); $event.stopPropagation();">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
      <ion-reorder slot="end"></ion-reorder>
    </ion-item>
  </ion-reorder-group>
</ion-content>
